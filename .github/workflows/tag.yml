name: tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Compute refs
        id: vars
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imjasonh/setup-crane@v0.7

      - name: Wait for the sha image to exist
        env:
          SRC: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            if crane digest "$SRC" >/dev/null 2>&1; then
              echo "found $SRC"
              exit 0
            fi
            echo "attempt $i: $SRC not found yet, waiting 10s"
            sleep 10
          done
          echo "::error::$SRC never appeared. Did the build workflow run for this commit on main?"
          exit 1

      - name: Retag without rebuilding
        env:
          SRC: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
        run: crane tag "$SRC" "${{ steps.vars.outputs.version }}"

      - name: Verify both tags are the same image
        env:
          SRC: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
          DST: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}
        run: |
          src_digest=$(crane digest "$SRC")
          dst_digest=$(crane digest "$DST")
          {
            echo "| tag | digest |"
            echo "| --- | --- |"
            echo "| \`${{ steps.vars.outputs.sha }}\` | \`$src_digest\` |"
            echo "| \`${{ steps.vars.outputs.version }}\` | \`$dst_digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$src_digest" = "$dst_digest" ] || { echo "::error::digests differ"; exit 1; }
